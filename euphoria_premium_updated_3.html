<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euphoria Lounge - Premium Experience</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:wght@300;400;700&display=swap');

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #fac207;
            border-radius: 3px;
        }

        .header {
            background: linear-gradient(180deg, rgba(26, 26, 46, 0.8) 0%, rgba(15, 15, 25, 0.9) 100%);
            padding: 24px 20px;
            text-align: center;
            border-bottom: 2px solid #fac207;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(250, 194, 7, 0.1);
            scroll-behavior: smooth;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo-container::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: radial-gradient(circle, rgba(250, 194, 7, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(250, 194, 7, 0.2); }
            50% { box-shadow: 0 0 40px rgba(250, 194, 7, 0.4); }
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 24px rgba(250, 194, 7, 0.3));
            animation: float 3s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .header-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 800;
            color: #fac207;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 16px rgba(250, 194, 7, 0.2);
        }

        .header-text p {
            font-size: 12px;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .search-container {
            padding: 20px;
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(5px);
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(26, 26, 46, 0.5);
            border: 2px solid rgba(250, 194, 7, 0.2);
            border-radius: 20px;
            padding: 14px 18px;
            width: 100%;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(8px);
        }

        .search-box:focus-within {
            background: rgba(26, 26, 46, 0.8);
            border-color: #fac207;
            box-shadow: 0 0 20px rgba(250, 194, 7, 0.3);
            transform: translateY(-2px);
        }

        .search-box input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
        }

        .search-box input::placeholder {
            color: rgba(200, 200, 200, 0.5);
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 16px 20px;
            background: rgba(10, 10, 10, 0.3);
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            flex-shrink: 0;
            padding: 12px 20px;
            background: rgba(26, 26, 46, 0.5);
            border: 2px solid rgba(250, 194, 7, 0.1);
            color: #c4b5a0;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            backdrop-filter: blur(5px);
        }

        .category-btn:hover {
            background: rgba(26, 26, 46, 0.8);
            border-color: #fac207;
            color: #fac207;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(250, 194, 7, 0.15);
        }

        .category-btn.active {
            background: #fac207;
            color: #1a1a2e;
            border-color: #fac207;
            box-shadow: 0 8px 24px rgba(250, 194, 7, 0.4);
            font-weight: 700;
        }

        .category-btn[data-category="food"] {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
            border-color: #ff6b35;
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.3);
            animation: foodGlow 2s ease-in-out infinite;
        }

        .category-btn[data-category="food"]:hover {
            background: linear-gradient(135deg, #ff8c42 0%, #ffa559 100%);
            border-color: #ff8c42;
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.5);
            transform: translateY(-4px) scale(1.05);
        }

        @keyframes foodGlow {
            0%, 100% {
                box-shadow: 0 4px 16px rgba(255, 107, 53, 0.3);
            }
            50% {
                box-shadow: 0 4px 24px rgba(255, 107, 53, 0.6);
            }
        }

        .menu-container {
            padding: 24px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .category-section {
            margin-bottom: 40px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 800;
            color: #fac207;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 3px solid #fac207;
            display: inline-block;
            text-shadow: 0 2px 8px rgba(250, 194, 7, 0.2);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 16px;
        }

        .item-card {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.7) 0%, rgba(20, 20, 35, 0.8) 100%);
            border: 2px solid rgba(250, 194, 7, 0.15);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            backdrop-filter: blur(8px);
            box-shadow: inset 0 1px 0 rgba(250, 194, 7, 0.1);
        }

        .item-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(250, 194, 7, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .item-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(250, 194, 7, 0.05) 0%, transparent 50%, rgba(250, 194, 7, 0.02) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .item-card:hover {
            border-color: #fac207;
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(250, 194, 7, 0.25), inset 0 1px 0 rgba(250, 194, 7, 0.2);
        }

        .item-card:hover::before {
            opacity: 1;
        }

        .item-card:hover::after {
            opacity: 1;
        }

        .item-image {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, rgba(250, 194, 7, 0.1) 0%, rgba(212, 175, 55, 0.05) 100%);
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            overflow: hidden;
            position: relative;
        }

        .item-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(250, 194, 7, 0.1), transparent);
            pointer-events: none;
        }

        .item-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            position: relative;
            z-index: 1;
            line-height: 1.3;
        }

        .item-price {
            font-size: 18px;
            font-weight: 700;
            color: #fac207;
            margin-bottom: 12px;
            display: flex;
            align-items: baseline;
            gap: 4px;
            position: relative;
            z-index: 1;
        }

        .item-price small {
            font-size: 11px;
            color: #b8975d;
            font-weight: 500;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(250, 194, 7, 0.1);
            border-radius: 8px;
            padding: 4px;
            position: relative;
            z-index: 1;
            margin-bottom: 12px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: #fac207;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: rgba(250, 194, 7, 0.2);
            transform: scale(1.1);
        }

        .qty-display {
            flex: 1;
            text-align: center;
            color: #fac207;
            font-size: 14px;
            font-weight: 600;
        }

        .buy-btn {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #fac207 0%, #d4af37 100%);
            border: none;
            color: #1a1a2e;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            overflow: hidden;
        }

        .buy-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(250, 194, 7, 0.4);
        }

        .buy-btn:hover::before {
            left: 100%;
        }

        .buy-btn:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            padding: 32px 20px;
            color: #999;
            font-size: 13px;
            border-top: 2px solid rgba(250, 194, 7, 0.1);
            margin-top: 40px;
        }

        .footer p {
            margin: 6px 0;
        }

        .cart-icon {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #fac207 0%, #d4af37 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(250, 194, 7, 0.4);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: bounce 2s ease-in-out infinite;
        }

        .cart-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(250, 194, 7, 0.5);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff4444;
            color: white;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.4);
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .cart-icon i {
            color: #1a1a2e;
            font-size: 36px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: flex-end;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            width: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 24px 24px 0 0;
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.4);
            border-top: 2px solid rgba(250, 194, 7, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px solid rgba(250, 194, 7, 0.2);
            padding-bottom: 16px;
        }

        .modal-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #fac207;
            font-weight: 800;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fac207;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            transform: rotate(90deg);
        }

        .cart-items {
            margin-bottom: 24px;
        }

        .cart-item {
            background: rgba(250, 194, 7, 0.05);
            border-left: 4px solid #fac207;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .cart-item-price {
            font-size: 13px;
            color: #b8975d;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(250, 194, 7, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .cart-item-qty button {
            background: none;
            border: none;
            color: #fac207;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .cart-item-qty button:hover {
            background: rgba(250, 194, 7, 0.2);
            border-radius: 4px;
        }

        .cart-item-delete {
            background: rgba(255, 68, 68, 0.1);
            border: none;
            color: #ff4444;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-left: 12px;
        }

        .cart-item-delete:hover {
            background: rgba(255, 68, 68, 0.3);
            transform: scale(1.1);
        }

        .order-summary {
            background: rgba(250, 194, 7, 0.08);
            border: 2px solid rgba(250, 194, 7, 0.2);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
        }

        .summary-row.total {
            border-top: 2px solid rgba(250, 194, 7, 0.2);
            padding-top: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #fac207;
        }

        .summary-label {
            color: #b8975d;
        }

        .summary-value {
            color: #ffffff;
            font-weight: 600;
        }

        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #fac207 0%, #d4af37 100%);
            border: none;
            color: #1a1a2e;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 24px rgba(250, 194, 7, 0.3);
            margin-bottom: 12px;
        }

        .checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(250, 194, 7, 0.4);
        }

        .checkout-btn:active {
            transform: translateY(-1px);
        }

        .continue-shopping-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 2px solid rgba(250, 194, 7, 0.3);
            color: #fac207;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .continue-shopping-btn:hover {
            border-color: #fac207;
            background: rgba(250, 194, 7, 0.1);
        }

        .empty-cart {
            text-align: center;
            padding: 40px 20px;
            color: #b8975d;
        }

        .empty-cart i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.7;
        }

        .toast {
            position: fixed;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: linear-gradient(135deg, #fac207 0%, #d4af37 100%);
            color: #1a1a2e;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 8px 24px rgba(250, 194, 7, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .contact-bar {
            display: flex;
            gap: 12px;
            padding: 0 20px;
            margin-top: 20px;
            position: fixed;
            bottom: 100px;
            left: 0;
            right: 0;
            justify-content: center;
            z-index: 999;
            flex-wrap: wrap;
        }

        .contact-btn {
            padding: 10px 16px;
            background: rgba(250, 194, 7, 0.1);
            border: 2px solid rgba(250, 194, 7, 0.3);
            color: #fac207;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .contact-btn:hover {
            background: rgba(250, 194, 7, 0.2);
            border-color: #fac207;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .header-text h1 {
                font-size: 28px;
            }

            .items-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .modal-content {
                padding: 20px;
            }

            .contact-bar {
                bottom: 90px;
                padding: 0 10px;
            }

            .contact-btn {
                font-size: 11px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

                { name: 'Barbecue', price: 9000, emoji: '🍖' },

                { name: 'Isawu Half Pot', price: 6000, emoji: '🍲' },
                { name: 'Nkobi Half Pot', price: 6000, emoji: '🍲' },

                { name: 'Noodles with Goat Meat & Egg', price: 5000, emoji: '🍜' },
                { name: 'Assorted Pepper Soup', price: 5000, emoji: '🍲' },
            ],
            energy: [
                { name: 'Red Bull', price: 1500, emoji: '⚡' },
                { name: 'Monster', price: 2000, emoji: '⚡' },
                { name: 'Blue Bullet', price: 1500, emoji: '⚡' },
                { name: 'Black Bullet', price: 2500, emoji: '⚡' },
            ]
        };

        let cart = [];
        const allItems = Object.values(menuData).flat();

        function getEmoji(itemName) {
            for (const category of Object.values(menuData)) {
                const item = category.find(i => i.name === itemName);
                if (item) return item.emoji;
            }
            return '🍾';
        }

        function generateHTML(items, category) {
            if (items.length === 0) {
                return `<div style="text-align: center; padding: 40px 20px; color: #666;">
                    <div style="font-size: 48px; margin-bottom: 12px;">🔍</div>
                    <p style="font-size: 16px; margin-bottom: 8px; color: #fff;">No items found</p>
                    <p style="font-size: 13px;">Try a different search term</p>
                </div>`;
            }

            const grouped = {};
            items.forEach(item => {
                const cat = category === 'all' ? 'Featured Selection' : category.charAt(0).toUpperCase() + category.slice(1);
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(item);
            });

            return Object.entries(grouped).map(([cat, catItems]) => `
                <div class="category-section">
                    <h2 class="category-title">${cat}</h2>
                    <div class="items-grid">
                        ${catItems.map(item => {
                            const cartItem = cart.find(c => c.name === item.name);
                            const qty = cartItem ? cartItem.qty : 0;
                            return `
                            <div class="item-card">
                                <div class="item-image">${item.emoji}</div>
                                <div class="item-name">${item.name}</div>
                                <div class="item-price">₦${item.price.toLocaleString()}<small>NGN</small></div>
                                ${qty > 0 ? `
                                    <div class="quantity-control">
                                        <button class="qty-btn" onclick="decrementQty('${item.name}')">−</button>
                                        <span class="qty-display">${qty}</span>
                                        <button class="qty-btn" onclick="incrementQty('${item.name}')">+</button>
                                    </div>
                                ` : ''}
                                <button class="buy-btn" onclick="addToCart('${item.name}', ${item.price})">
                                    ${qty > 0 ? 'Add More' : 'Add to Order'}
                                </button>
                            </div>
                        `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderMenu(category = 'all') {
            let items = category === 'all' ? allItems : menuData[category] || [];
            document.getElementById('menuContent').innerHTML = generateHTML(items, category);
        }

        function addToCart(name, price) {
            const existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.qty++;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCart();
            renderMenu(getActiveCategory());
            showToast(`${name} added to order! ✨`);
        }

        function incrementQty(name) {
            const item = cart.find(i => i.name === name);
            if (item) item.qty++;
            updateCart();
            renderMenu(getActiveCategory());
        }

        function decrementQty(name) {
            const item = cart.find(i => i.name === name);
            if (item) {
                item.qty--;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.name !== name);
                }
            }
            updateCart();
            renderMenu(getActiveCategory());
        }

        function removeFromCart(name) {
            cart = cart.filter(item => item.name !== name);
            updateCart();
            renderCart();
        }

        function getActiveCategory() {
            return document.querySelector('.category-btn.active').dataset.category;
        }

        function updateCart() {
            const badge = document.getElementById('cartBadge');
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            if (total > 0) {
                badge.textContent = total;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            const summaryContainer = document.getElementById('orderSummaryContainer');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-bag"></i>
                        <p>Your cart is empty</p>
                        <p style="font-size: 12px; margin-top: 8px;">Start adding items to your order</p>
                    </div>
                `;
                summaryContainer.style.display = 'none';
                return;
            }

            summaryContainer.style.display = 'block';
            container.innerHTML = `
                <div class="cart-items">
                    ${cart.map(item => {
                        const total = item.price * item.qty;
                        return `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-price">₦${item.price.toLocaleString()} × ${item.qty} = ₦${total.toLocaleString()}</div>
                            </div>
                            <div class="cart-item-qty">
                                <button onclick="updateQty('${item.name}', -1)">−</button>
                                <span style="width: 24px; text-align: center;">${item.qty}</span>
                                <button onclick="updateQty('${item.name}', 1)">+</button>
                            </div>
                            <button class="cart-item-delete" onclick="removeFromCart('${item.name}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        `;
                    }).join('')}
                </div>
            `;

            updateSummary();
        }

        function updateQty(name, change) {
            const item = cart.find(i => i.name === name);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    removeFromCart(name);
                } else {
                    renderCart();
                }
            }
        }

        function updateSummary() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const deliveryFee = 500;
            const total = subtotal + deliveryFee;

            document.getElementById('subtotal').textContent = subtotal.toLocaleString();
            document.getElementById('deliveryFee').textContent = deliveryFee.toLocaleString();
            document.getElementById('total').textContent = total.toLocaleString();
        }

        function openCart() {
            renderCart();
            document.getElementById('cartModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                showToast('Cart is empty!');
                return;
            }

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const deliveryFee = 500;
            const total = subtotal + deliveryFee;

            let message = '🎉 *EUPHORIA LOUNGE ORDER* 🎉\n\n';
            message += '*Order Details:*\n';
            message += '─────────────────\n';

            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                message += `${item.name}\n`;
                message += `₦${item.price.toLocaleString()} × ${item.qty} = ₦${itemTotal.toLocaleString()}\n\n`;
            });

            message += '─────────────────\n';
            message += `*Subtotal:* ₦${subtotal.toLocaleString()}\n`;
            message += `*Delivery Fee:* ₦${deliveryFee.toLocaleString()}\n`;
            message += `*TOTAL: ₦${total.toLocaleString()}*\n\n`;
            message += '✨ Happiness Lives Here ✨\n';
            message += 'Thank you for your order!\n';

            const whatsappUrl = `https://wa.me/2349167648820?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');

            showToast('Order sent to WhatsApp! 🚀');
            setTimeout(() => {
                cart = [];
                updateCart();
                closeCart();
                renderMenu(getActiveCategory());
            }, 1000);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderMenu(btn.dataset.category);
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allItems.filter(item => item.name.toLowerCase().includes(query));
            document.getElementById('menuContent').innerHTML = generateHTML(filtered, 'all');
        });

        document.getElementById('cartModal').addEventListener('click', (e) => {
            if (e.target.id === 'cartModal') {
                closeCart();
            }
        });

        renderMenu();
    </script>
